[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-framework-analysis"
version = "2.0.0"
description = "Reproducible analyses of reviewed remote-speech recording-quality features"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4.2,<5", "ipykernel>=6.29,<7", "nbformat>=5.10,<6"]
dev = ["pytest>=8,<9", "ruff>=0.5,<1"]

[project.scripts]
rq-final-analysis = "rq_analysis.final_pipeline:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
